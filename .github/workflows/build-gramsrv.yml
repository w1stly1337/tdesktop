name: Build gramsrv TDesktop

on:
  workflow_dispatch:
  push:
    branches: [main, dev]

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries

      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive
          path: TBuild/tdesktop

      - name: Verify gramsrv patch applied.
        shell: bash
        run: |
          TARGET="TBuild/tdesktop/Telegram/SourceFiles/mtproto/mtproto_dc_options.cpp"
          echo "Checking DC options..."
          grep -c "2.27.200.43" "${TARGET}" || { echo "ERROR: Patch not applied!"; exit 1; }
          grep -c "MIIBCgKCAQEA1J8JIDACtrn6" "${TARGET}" || { echo "ERROR: RSA key not patched!"; exit 1; }
          echo "Patch verified OK"

      - name: First set up.
        shell: bash
        run: |
          SDK="$(grep "SDK version" TBuild/tdesktop/docs/building-win.md | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          echo "$(sha256sum TBuild/tdesktop/Telegram/build/prepare/prepare.py | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: "14.44"

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        id: cache-third-party
        uses: actions/cache@v6
        with:
          path: TBuild\ThirdParty
          key: ${{ runner.OS }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-third-party-

      - name: Libraries cache.
        id: cache-libs
        uses: actions/cache@v6
        with:
          path: TBuild\Libraries\win64\*
          key: ${{ runner.OS }}-libs-v2-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-libs-v2-

      - name: Qt cache.
        id: cache-qt
        uses: actions/cache@v6
        with:
          path: TBuild\Libraries\win64\qt6*
          key: ${{ runner.OS }}-qt6-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-qt6-

      - name: Libraries.
        run: |
          cd TBuild\tdesktop\Telegram
          set LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64
          call build\prepare\win.bat skip-release silent qt6

      - name: Free up disk space.
        shell: bash
        run: find TBuild/Libraries/win64 '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' ')' -type f ')' -o -empty ')' -delete

      - name: Build Telegram Desktop.
        run: |
          cd TBuild\tdesktop\Telegram
          set LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64
          call configure.bat x64 qt6 -D TDESKTOP_API_TEST=ON -D CMAKE_CONFIGURATION_TYPES=Release
          cmake --build ..\out --config Release --parallel

      - name: Upload artifact.
        uses: actions/upload-artifact@v7
        with:
          name: gramsrv-tdesktop-win64
          path: TBuild\tdesktop\out\Release\Telegram.exe
          retention-days: 7
