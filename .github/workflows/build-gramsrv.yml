name: Build gramsrv TDesktop

on:
  workflow_dispatch:
  push:
    branches: [main, dev]

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest

    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries

      - name: Clone Layer 225 compatible commit.
        uses: actions/checkout@v7
        with:
          ref: 9caf32dffc90ddd9bb08ad5777b865f729fa167b
          submodules: recursive
          path: TBuild/tdesktop

      - name: Patch DC IPs to gramsrv.
        shell: bash
        run: |
          TARGET="TBuild/tdesktop/Telegram/SourceFiles/mtproto/mtproto_dc_options.cpp"
          sed -i 's/{ 1, "149\.154\.175\.50"[[:space:]]*, 443 }/{ 1, "2.27.200.43", 2398 }/' "$TARGET"
          sed -i 's/{ 2, "149\.154\.167\.51"[[:space:]]*, 443 }/{ 2, "2.27.200.43", 2398 }/' "$TARGET"
          sed -i 's/{ 2, "95\.161\.76\.100"[[:space:]]*, 443 }/{ }/' "$TARGET"
          sed -i 's/{ 3, "149\.154\.175\.100", 443 }/{ 3, "2.27.200.43", 2398 }/' "$TARGET"
          sed -i 's/{ 4, "149\.154\.167\.91"[[:space:]]*, 443 }/{ 4, "2.27.200.43", 2398 }/' "$TARGET"
          sed -i 's/{ 5, "149\.154\.171\.5"[[:space:]]*, 443 }/{ 5, "2.27.200.43", 2398 }/' "$TARGET"
          sed -i 's/{ 1, "2001:0b28:f23d:f001:0000:0000:0000:000a", 443 }/{ 1, "2.27.200.43", 2398 }/' "$TARGET"
          sed -i 's/{ 2, "2001:067c:04e8:f002:0000:0000:0000:000a", 443 }/{ 2, "2.27.200.43", 2398 }/' "$TARGET"
          sed -i 's/{ 3, "2001:0b28:f23d:f003:0000:0000:0000:000a", 443 }/{ 3, "2.27.200.43", 2398 }/' "$TARGET"
          sed -i 's/{ 4, "2001:067c:04e8:f004:0000:0000:0000:000a", 443 }/{ 4, "2.27.200.43", 2398 }/' "$TARGET"
          sed -i 's/{ 5, "2001:0b28:f23f:f005:0000:0000:0000:000a", 443 }/{ 5, "2.27.200.43", 2398 }/' "$TARGET"
          sed -i 's/{ 1, "149\.154\.175\.10"[[:space:]]*, 443 }/{ 1, "2.27.200.43", 2398 }/' "$TARGET"
          sed -i 's/{ 2, "149\.154\.167\.40"[[:space:]]*, 443 }/{ 2, "2.27.200.43", 2398 }/' "$TARGET"
          sed -i 's/{ 3, "149\.154\.175\.117", 443 }/{ 3, "2.27.200.43", 2398 }/' "$TARGET"
          sed -i 's/{ 1, "2001:0b28:f23d:f001:0000:0000:0000:000e", 443 }/{ 1, "2.27.200.43", 2398 }/' "$TARGET"
          sed -i 's/{ 2, "2001:067c:04e8:f002:0000:0000:0000:000e", 443 }/{ 2, "2.27.200.43", 2398 }/' "$TARGET"
          sed -i 's/{ 3, "2001:0b28:f23d:f003:0000:0000:0000:000e", 443 }/{ 3, "2.27.200.43", 2398 }/' "$TARGET"
          echo "DC patch done: $(grep -c '2.27.200.43' "$TARGET") entries"

      - name: Patch RSA keys to gramsrv.
        shell: bash
        run: |
          python3 .github/patch_rsa.py "TBuild/tdesktop/Telegram/SourceFiles/mtproto/mtproto_dc_options.cpp"

      - name: First set up.
        shell: bash
        run: |
          SDK="$(grep "SDK version" TBuild/tdesktop/docs/building-win.md | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV
          echo "$(sha256sum TBuild/tdesktop/Telegram/build/prepare/prepare.py | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV
          echo "TBUILD=${GITHUB_WORKSPACE}/TBuild" >> $GITHUB_ENV
          echo "LibrariesPath=${GITHUB_WORKSPACE}/TBuild/Libraries/win64" >> $GITHUB_ENV
          git config --global user.email "you@example.com"
          git config --global user.name "Sample"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: "14.44"

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: Libraries.
        run: |
          cd TBuild\tdesktop\Telegram
          call build\prepare\win.bat skip-release silent qt6

      - name: Build Telegram Desktop.
        run: |
          cd TBuild\tdesktop\Telegram
          call configure.bat x64 qt6 -D TDESKTOP_API_TEST=ON -D CMAKE_CONFIGURATION_TYPES=Debug -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON -D CMAKE_POLICY_DEFAULT_CMP0218=NEW
          cmake --build ..\out --config Debug --parallel 2>&1

      - name: Upload artifact.
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gramsrv-tdesktop-win64
          path: TBuild\tdesktop\out\Debug\Telegram.exe
          retention-days: 7
